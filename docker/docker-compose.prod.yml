version: "3.9"

# =====================================================
#  生产环境 Docker Compose
#  用法：
#    1. 复制 .env.example → .env，填写真实值
#    2. docker compose -f docker-compose.prod.yml up -d
# =====================================================

services:

  # ── PostgreSQL 数据库 ─────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: saas_postgres
    restart: always
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # 生产环境不暴露端口到公网
    expose:
      - "5432"

  # ── Redis 缓存 ────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: saas_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    expose:
      - "6379"

  # ── FastAPI 后端 ──────────────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: saas_backend
    restart: always
    environment:
      DATABASE_URL:      postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL:         redis://:${REDIS_PASSWORD}@redis:6379/0
      SECRET_KEY:        ${SECRET_KEY}
      ALLOWED_ORIGINS:   ${ALLOWED_ORIGINS}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      MINIMAX_BASE_URL:  ${MINIMAX_BASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"

  # ── Next.js 前端 ──────────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: saas_frontend
    restart: always
    expose:
      - "3000"
    depends_on:
      - backend

  # ── Nginx 反向代理 ────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: saas_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro          # SSL 证书目录（Let's Encrypt）
      - nginx_logs:/var/log/nginx
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  redis_data:
  nginx_logs:
